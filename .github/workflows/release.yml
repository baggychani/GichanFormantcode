# 태그 push 또는 수동 실행 → 테스트 → 두 가지 제품 빌드 → GitHub Release 게시
#
# 산출물 (포터블 zip 없음):
#   1) PySide   : Windows Setup.exe + macOS .app zip
#   2) Desktop  : React/Tauri Windows NSIS 설치기
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 (비우면 config.APP_VERSION 사용, 예: 3.0.0)"
        required: false
        type: string
      create_github_release:
        description: "배포 레포 baggychani/GichanFormant 에 Release·바이너리 업로드 (권장)"
        required: false
        type: boolean
        default: true
      publish_to_code_repo:
        description: "(선택) 코드 레포(GichanFormantcode)에도 Release 업로드"
        required: false
        type: boolean
        default: false
      build_pyside:
        description: "PySide 설치기 빌드"
        required: false
        type: boolean
        default: true
      build_desktop:
        description: "React/Tauri Desktop 설치기 빌드"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Version sync & validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
      tag: ${{ steps.out.outputs.tag }}
      build_pyside: ${{ steps.flags.outputs.build_pyside }}
      build_desktop: ${{ steps.flags.outputs.build_desktop }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Resolve version
        id: out
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          else
            VER=$(uv run python -c "import re; t=open('config.py',encoding='utf-8').read(); print(re.search(r'APP_VERSION = \"([^\"]+)\"', t).group(1))")
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}"

      - name: Build flags
        id: flags
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "build_pyside=${{ inputs.build_pyside }}" >> "$GITHUB_OUTPUT"
            echo "build_desktop=${{ inputs.build_desktop }}" >> "$GITHUB_OUTPUT"
          else
            echo "build_pyside=true" >> "$GITHUB_OUTPUT"
            echo "build_desktop=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync version files from config / tag
        run: uv run python scripts/sync_version.py --set "${{ steps.out.outputs.version }}"

      - name: Verify version consistency
        run: uv run python scripts/sync_version.py --check

      - name: Upload synced metadata
        uses: actions/upload-artifact@v6
        with:
          name: version-metadata
          retention-days: 1
          path: |
            config.py
            GichanFormant.iss
            info.txt
            complete.txt
            pyproject.toml

  test:
    name: Tests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked --all-extras --dev
      - name: Install Qt runtime (PySide6 on headless Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libx11-xcb1
      - name: Sidecar smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/test_sidecar_host.py -q -vv --maxfail=1
      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/ -q

  build-pyside-windows:
    name: PySide · Windows Setup
    needs: [prepare, test]
    if: needs.prepare.outputs.build_pyside == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download synced version files
        uses: actions/download-artifact@v6
        with:
          name: version-metadata

      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - run: uv sync --locked --all-extras --dev

      - name: PyInstaller (onedir, Inno Setup 호환)
        shell: pwsh
        run: |
          uv run pyinstaller --noconfirm --windowed `
            --icon=assets/icon.ico `
            --name=GichanFormant `
            --version-file=info.txt `
            --hidden-import=xlrd `
            --add-data "assets;assets" `
            main.py
          if (-not (Test-Path "dist\GichanFormant\GichanFormant.exe")) {
            throw "PyInstaller output not found at dist\GichanFormant\GichanFormant.exe"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found: $iscc" }
          & $iscc "/DMyOutputDir=$PWD\release" "GichanFormant.iss"
          $setup = Get-ChildItem -Path release -Filter "GichanFormant_v${env:VERSION}_Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup exe not found under release\" }
          # Distinguish from the React/Tauri installer in the same Release.
          $renamed = Join-Path $setup.DirectoryName "GichanFormant-PySide_v${env:VERSION}_Setup.exe"
          Move-Item -LiteralPath $setup.FullName -Destination $renamed -Force
          Write-Host "Built installer: $renamed"

      - uses: actions/upload-artifact@v6
        with:
          name: pyside-windows-release
          retention-days: 1
          path: release/GichanFormant-PySide_v*_Setup.exe

  build-pyside-macos:
    name: PySide · macOS (${{ matrix.label }})
    needs: [prepare, test]
    if: needs.prepare.outputs.build_pyside == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: arm64
            artifact: GichanFormant-PySide-macos-arm64
          - os: macos-15-intel
            label: intel
            artifact: GichanFormant-PySide-macos-intel
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: version-metadata

      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - run: uv sync --locked --all-extras --dev

      - name: PyInstaller
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          uv run pyinstaller --noconfirm --windowed \
            --name=GichanFormant \
            --version-file=info.txt \
            --hidden-import=xlrd \
            --add-data "assets:assets" \
            main.py
          cd dist
          ditto -c -k --sequesterRsrc --keepParent GichanFormant.app "../${{ matrix.artifact }}-v${VERSION}.zip"
          cd ..

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-release
          retention-days: 1
          path: ${{ matrix.artifact }}-v*.zip

  build-desktop-windows:
    name: Desktop · React/Tauri Windows NSIS
    needs: [prepare, test]
    if: needs.prepare.outputs.build_desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Download synced version files
        uses: actions/download-artifact@v6
        with:
          name: version-metadata

      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked --all-extras --dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop frontend deps
        working-directory: desktop
        run: npm ci

      - name: Sync Tauri app version
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $conf = "desktop/src-tauri/tauri.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.version = $env:VERSION
          $json | ConvertTo-Json -Depth 20 | Set-Content $conf -Encoding utf8
          $pkg = "desktop/package.json"
          $pkgJson = Get-Content $pkg -Raw | ConvertFrom-Json
          $pkgJson.version = $env:VERSION
          $pkgJson | ConvertTo-Json -Depth 20 | Set-Content $pkg -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri (NSIS only, no portable)
        working-directory: desktop
        run: npm run tauri:build

      - name: Collect NSIS installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path release-desktop | Out-Null
          $nsis = Get-ChildItem -Path "desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $nsis) {
            Get-ChildItem -Path "desktop/src-tauri/target/release/bundle" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            throw "Tauri NSIS installer not found"
          }
          $dest = "release-desktop/GichanFormant-Desktop_v${env:VERSION}_x64-Setup.exe"
          Copy-Item -LiteralPath $nsis.FullName -Destination $dest -Force
          Write-Host "Built Desktop installer: $dest"

      - uses: actions/upload-artifact@v6
        with:
          name: desktop-windows-release
          retention-days: 1
          path: release-desktop/GichanFormant-Desktop_v*_x64-Setup.exe

  publish-deploy:
    name: Publish → baggychani/GichanFormant
    needs:
      - prepare
      - build-pyside-windows
      - build-pyside-macos
      - build-desktop-windows
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (needs.build-pyside-windows.result == 'success' || needs.build-pyside-windows.result == 'skipped') &&
      (needs.build-pyside-macos.result == 'success' || needs.build-pyside-macos.result == 'skipped') &&
      (needs.build-desktop-windows.result == 'success' || needs.build-desktop-windows.result == 'skipped') &&
      (
        needs.build-pyside-windows.result == 'success' ||
        needs.build-pyside-macos.result == 'success' ||
        needs.build-desktop-windows.result == 'success'
      ) &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        || (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
      )
    steps:
      - name: Require deploy repo token
        run: |
          if [ -z "${{ secrets.DEPLOY_REPO_TOKEN }}" ]; then
            echo "::error::Secrets에 DEPLOY_REPO_TOKEN 이 없습니다. BUILD.md 의 배포 레포 자동 업로드 절을 참고하세요."
            exit 1
          fi

      - uses: actions/download-artifact@v6
        with:
          pattern: "*-release"
          merge-multiple: true
          path: dist-upload
        continue-on-error: true

      - name: List release files
        run: find dist-upload -type f | sort

      - name: Create Release on deploy repo (gh CLI, PAT only)
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VER="${{ needs.prepare.outputs.version }}"
          REPO="baggychani/GichanFormant"
          mapfile -t FILES < <(find dist-upload -type f \( -name '*.exe' -o -name '*.zip' \) 2>/dev/null || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::dist-upload 에 exe/zip 이 없습니다."
            exit 1
          fi
          echo "Uploading ${#FILES[@]} file(s) to ${REPO} ${TAG}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          fi
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$REPO" \
            --title "GichanFormant ${VER}" \
            --notes "## GichanFormant ${VER}

          ### PySide
          - \`GichanFormant-PySide_v${VER}_Setup.exe\` — Windows 설치 프로그램
          - \`GichanFormant-PySide-macos-*-v${VER}.zip\` — macOS 앱

          ### Desktop (React / Tauri)
          - \`GichanFormant-Desktop_v${VER}_x64-Setup.exe\` — Windows NSIS 설치 프로그램

          포터블 zip은 배포하지 않습니다." \
            --latest

  publish-code-repo:
    name: Publish → GichanFormantcode (optional)
    needs:
      - prepare
      - build-pyside-windows
      - build-pyside-macos
      - build-desktop-windows
    runs-on: ubuntu-latest
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (
        needs.build-pyside-windows.result == 'success' ||
        needs.build-pyside-macos.result == 'success' ||
        needs.build-desktop-windows.result == 'success'
      ) &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_to_code_repo
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: "*-release"
          merge-multiple: true
          path: dist-upload
        continue-on-error: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: GichanFormant ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: dist-upload/**/*
          fail_on_unmatched_files: true

  cleanup-artifacts:
    name: Delete workflow artifacts
    needs:
      - build-pyside-windows
      - build-pyside-macos
      - build-desktop-windows
      - publish-deploy
      - publish-code-repo
    if: >-
      always() &&
      (
        needs.build-pyside-windows.result == 'success' ||
        needs.build-pyside-macos.result == 'success' ||
        needs.build-desktop-windows.result == 'success'
      ) &&
      needs.publish-deploy.result != 'failure' &&
      needs.publish-code-repo.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove Actions artifacts for this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate -q '.artifacts[].id')
          if [ -z "$ids" ]; then
            echo "No artifacts to delete."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting artifact ${id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
